<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Session parked</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fff;
        --fg: #1a1a1e;
        --muted: #71717a;
        --accent: #20744a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #181b1a;
          --fg: #f4f4f5;
          --muted: #a1a1aa;
          --accent: #4ade80;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
        margin: 0;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.5 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .page {
        width: min(100%, 576px);
        display: grid;
        justify-items: center;
        gap: 24px;
      }
      .title {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }
      .message {
        margin: 0;
      }
      .metadata {
        width: 100%;
        display: grid;
        gap: 8px;
      }
      .field {
        display: grid;
        grid-template-columns: 80px minmax(0, 1fr);
        gap: 12px;
        margin: 0;
      }
      .label {
        font-weight: 600;
      }
      .value {
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .return {
        min-height: 40px;
        display: inline-grid;
        place-items: center;
        padding: 0 12px;
        color: var(--accent);
        font-weight: 600;
        text-decoration: none;
        border-radius: 4px;
      }
      .return:hover {
        background: color-mix(in srgb, var(--accent) 10%, transparent);
      }
      .return:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="page" aria-labelledby="title"></main>
    <script>
      (function () {
        var p = new URLSearchParams(location.search),
          r = document.querySelector(".page"),
          t = document.createElement("h1");
        t.className = "title";
        t.id = "title";
        t.textContent = "Session parked";
        r.append(t);
        var m = document.createElement("p");
        m.className = "message";
        m.textContent = "session parked";
        r.append(m);
        var f = [
            ["Title", "title"],
            ["Project", "project"],
            ["Directory", "cwd"],
            ["Branch", "branch"],
          ],
          d = document.createElement("dl");
        d.className = "metadata";
        f.forEach(function (x) {
          var v = (p.get(x[1]) || "").trim();
          if (!v) return;
          var q = document.createElement("div");
          q.className = "field";
          var l = document.createElement("dt");
          l.className = "label";
          l.textContent = x[0];
          var z = document.createElement("dd");
          z.className = "value";
          z.textContent = v;
          q.append(l, z);
          d.append(q);
        });
        if (d.children.length) r.append(d);
        var e = (p.get("environmentId") || "").trim(),
          n = (p.get("threadId") || "").trim();
        if (e && n) {
          var a = document.createElement("a");
          a.className = "return";
          a.textContent = "Return to session";
          a.href = "/h/" + encodeURIComponent(e) + "/agent/" + encodeURIComponent(n);
          r.append(a);
        }
      })();
    </script>
  </body>
</html>
